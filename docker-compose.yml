services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: betterdays
      POSTGRES_USER: betterdays
      POSTGRES_PASSWORD: betterdays_dev_password
    ports:
      - "5432:5432"
    volumes:
      - betterdays_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterdays -d betterdays"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://betterdays:betterdays_dev_password@db:5432/betterdays
      JWT_SECRET: dev-only-change-me-before-deployment
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  betterdays_pg:
